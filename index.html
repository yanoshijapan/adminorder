<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanoshi Order Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8f9fa; }
        .sticky-header { position: sticky; top: 0; z-index: 50; }
        .gold-accent { color: #D4AF37; }
        .bg-red-yanoshi { background-color: #cc0000; }
        .border-gold { border-color: #D4AF37; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="overflow-x-hidden" x-data="dashboardApp()" x-init="fetchData()">

    <header class="sticky-header bg-white shadow-md border-b-4 border-red-600">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center space-x-2">
										<img src="https://yanoshijapan.github.io/asetonline/logohitam.png" alt="Yanoshi" class="h-10 w-auto object-contain cursor-pointer">
                    <h1 class="gold-accent text-sm">ADMIN <span class="gold-accent text-sm">DASHBOARD</span></h1>
                </div>
                
                <div class="flex flex-1 max-w-2xl gap-2">
                    <input type="text" x-model="searchQuery" placeholder="Cari nama customer..." 
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none transition text-sm">
                    <select x-model="statusFilter" class="px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-500">
                        <option value="">Semua Status</option>
                        <template x-for="st in statusOptions">
                            <option :value="st" x-text="st"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div x-show="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
        </div>

        <div class="grid grid-cols-1 gap-6" x-show="!loading">
            <template x-for="item in filteredData" :key="item.row">
                <div class="bg-white rounded-xl shadow-sm border-l-8 border-red-600 hover:shadow-md transition p-5 relative break-words">
                    
                    <div class="flex justify-between items-start mb-4 border-b pb-3">
                        <div>
                            <span class="text-[10px] uppercase font-bold text-gray-400" x-text="'ID: ' + item.orderId"></span>
                            <h2 class="text-lg font-bold text-gray-800" x-text="item.customer"></h2>
                            <p class="text-xs text-gray-500" x-text="formatDate(item.tglOrder)"></p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-2">
                            <!-- TOMBOL HAPUS -->
                            <button @click="deleteData(item.row, item.customer)" class="text-[10px] bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded font-bold transition">
                                🗑️ HAPUS
                            </button>
                            <!-- DROPDOWN STATUS -->
                            <select @change="updateStatus(item.row, $event.target.value)" 
                                    :class="getStatusColor(item.status)"
                                    class="text-xs font-bold px-3 py-1 rounded-full border-none cursor-pointer focus:ring-2 focus:ring-yellow-400 mt-1">
                                <template x-for="st in statusOptions">
                                    <option :value="st" x-text="st" :selected="st === item.status"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
                        <div class="space-y-2">
                            <div class="flex items-center text-green-600 font-semibold">
                                <span class="mr-2">📞</span> <span x-text="item.whatsapp"></span>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                                <div class="flex justify-between items-center cursor-pointer" @click="item.showItems = !item.showItems">
                                    <span class="font-bold text-xs uppercase text-gray-500">List Pesanan</span>
                                    <span x-text="item.showItems ? '▲' : '▼'" class="text-[10px]"></span>
                                </div>
                                <div x-show="item.showItems" x-cloak class="mt-2 text-xs leading-relaxed break-all whitespace-pre-wrap" x-html="item.listPesanan"></div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button @click="copyFormat(item)" class="w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded font-bold text-xs transition">
                                📋 COPY FORMAT ORDER
                            </button>
                            
                            <div class="flex flex-col space-y-2">
                                <div class="flex justify-between items-center border-b pb-1">
                                    <span class="text-xs font-bold text-gray-500">INVOICE</span>
                                    <template x-if="item.invoice">
                                        <a :href="item.invoice" target="_blank" class="text-blue-600 underline text-xs">Buka Link</a>
                                    </template>
                                    <button @click="openModal(item.row, 15, 'Input Link Invoice')" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded font-bold">INPUT</button>
                                </div>
                                <div class="flex justify-between items-center border-b pb-1">
                                    <span class="text-xs font-bold text-gray-500">BUKTI BAYAR</span>
                                    <template x-if="item.buktiBayar">
                                        <a :href="item.buktiBayar" target="_blank" class="text-blue-600 underline text-xs">Buka Link</a>
                                    </template>
                                    <button @click="openModal(item.row, 16, 'Input Link Bukti Bayar')" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded font-bold">INPUT</button>
                                </div>
                                <div class="flex justify-between items-center border-b pb-1 gap-2">
                                    <span class="text-xs font-bold text-gray-500 whitespace-nowrap">RESI</span>
                                    <span x-text="item.resi || '-'" class="text-xs font-mono break-all text-right flex-1"></span>
                                    <button @click="openModal(item.row, 17, 'Input No Resi')" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded font-bold whitespace-nowrap">INPUT</button>
                                </div>
                            </div>
                        </div>

                        <div class="text-xs bg-red-50 p-3 rounded-lg border border-red-100 flex flex-col justify-between">
                            <div>
                                <p class="font-bold text-red-700 mb-1">INFO PENGIRIMAN</p>
                                <p><b x-text="item.penerima"></b> | <span x-text="item.noPenerima"></span></p>
                                <p class="mt-1 italic text-gray-600" x-text="item.alamat"></p>
                                <p class="mt-2 font-bold text-gray-700">Tanggal Kirim: <span x-text="formatDate(item.tglKirim)"></span></p>
                            </div>
                            
                            <!-- FITUR ONGKIR -->
                            <div class="mt-3 pt-2 border-t border-red-200 flex justify-between items-center">
                                <span class="font-bold text-red-700">Ongkos Kirim:</span>
                                
                                <!-- Jika data ongkir sudah ada: Tampilkan angka & Tombol Edit -->
                                <template x-if="item.ongkir">
                                    <div class="flex items-center space-x-2">
                                        <span x-text="formatRupiah(item.ongkir)" class="font-bold text-gray-800 text-sm"></span>
                                        <button @click="openModal(item.row, 7, 'Edit Ongkos Kirim', item.ongkir)" 
                                                class="text-[10px] text-blue-600 underline hover:text-blue-800">Edit</button>
                                    </div>
                                </template>
                                
                                <!-- Jika data ongkir kosong: Tombol INPUT -->
                                <template x-if="!item.ongkir">
                                    <button @click="openModal(item.row, 7, 'Input Ongkos Kirim (Angka saja)')" 
                                            class="text-[10px] bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded shadow-sm font-bold transition">
                                        INPUT ONGKIR
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <div x-show="modalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 px-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-gray-800" x-text="modalTitle"></h3>
            <input type="text" x-model="modalValue" class="w-full px-4 py-2 border rounded-lg mb-6 outline-none focus:ring-2 focus:ring-red-600">
            <div class="flex justify-end space-x-3">
                <button @click="modalOpen = false" class="px-4 py-2 text-gray-500 font-bold">BATAL</button>
                <button @click="submitModal()" class="px-6 py-2 bg-red-yanoshi text-white rounded-lg font-bold shadow-lg">SUBMIT</button>
            </div>
        </div>
    </div>

    <script>
        function dashboardApp() {
            return {
                apiUrl: 'https://script.google.com/macros/s/AKfycbz3V7oaXEBuQAATvcrZsDtGFIXAKTl_h3drbgjksBkJEbFZhjJP2WUSTrPv9mxHm35M/exec', // Ganti dengan URL Deploy AppScript
                loading: true,
                allData: [],
                searchQuery: '',
                statusFilter: '',
                statusOptions: ['menunggu', 'DRAFT', 'Verifying', 'Sudah Bayar', 'Sudah Kirim', 'SENT', 'READY'],
                modalOpen: false,
                modalTitle: '',
                modalValue: '',
                activeRow: null,
                activeCol: null,

                async fetchData() {
                    this.loading = true;
                    try {
                        const response = await fetch(`${this.apiUrl}?action=read`);
                        let data = await response.json();
                        
                        // FUNGSI BARU: Mengurutkan data berdasarkan tanggal order (tglOrder) dari terbaru ke terlama
                        data.sort((a, b) => {
                            // Mengubah format tanggal dari spreadsheet menjadi format waktu yang bisa dihitung
                            const dateA = new Date(a.tglOrder).getTime();
                            const dateB = new Date(b.tglOrder).getTime();
                            
                            // Jika tanggal kosong/tidak valid, taruh di bawah
                            if (isNaN(dateA)) return 1;
                            if (isNaN(dateB)) return -1;
                            
                            // Mengurutkan dari yang terbesar (terbaru) ke terkecil (terlama)
                            return dateB - dateA; 
                        });

                        this.allData = data.map(item => ({...item, showItems: false}));
                    } catch (e) { 
                        console.error("Error fetch:", e); 
                    }
                    this.loading = false;
                },

                get filteredData() {
                    return this.allData.filter(i => {
                        const matchSearch = i.customer.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchStatus = this.statusFilter === '' || i.status === this.statusFilter;
                        return matchSearch && matchStatus;
                    });
                },

                async updateStatus(row, val) {
                    await fetch(`${this.apiUrl}?action=update&row=${row}&col=8&val=${encodeURIComponent(val)}`);
                    this.fetchData();
                },

                openModal(row, col, title, currentValue = '') {
                    this.activeRow = row;
                    this.activeCol = col;
                    this.modalTitle = title;
                    this.modalValue = currentValue; // Nilai saat ini otomatis masuk ke input modal
                    this.modalOpen = true;
                },

                async submitModal() {
                    this.modalOpen = false;
                    this.loading = true;
                    await fetch(`${this.apiUrl}?action=update&row=${this.activeRow}&col=${this.activeCol}&val=${encodeURIComponent(this.modalValue)}`);
                    this.fetchData();
                },
								
								async deleteData(row, customerName) {
                    // Munculkan Popup Konfirmasi Bawaan Browser
                    const confirmDelete = confirm(`PERINGATAN!\nApakah Anda yakin ingin menghapus seluruh data milik: ${customerName}?\n\nData yang dihapus dari Dashboard juga akan hilang permanen dari Spreadsheet.`);
                    
                    if (confirmDelete) {
                        this.loading = true;
                        try {
                            await fetch(`${this.apiUrl}?action=delete&row=${row}`);
                            await this.fetchData(); // Refresh data setelah berhasil dihapus
                            alert(`Data ${customerName} berhasil dihapus.`);
                        } catch (e) {
                            console.error("Gagal menghapus:", e);
                            alert("Terjadi kesalahan saat menghapus data.");
                        }
                    }
                },
								
                copyFormat(i) {
                    const text = `*FORMAT PEMESANAN* :
Nama Customer : ${i.customer}
No Whatsapp : ${i.whatsapp}

*INFO PENGIRIMAN* :
Nama Penerima : ${i.penerima}
Nomor Penerima : ${i.noPenerima}
Alamat Pengiriman : ${i.alamat}
Request Kirim Tanggal : ${this.formatDate(i.tglKirim)}

List Pesanan :
${i.listPesanan}`;
                    navigator.clipboard.writeText(text);
                    alert('Format Order disalin!');
                },

                formatDate(dateStr) {
                    if(!dateStr) return '-';
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                },
								
								formatRupiah(angka) {
                    if (!angka || isNaN(angka)) return angka; // Jika bukan angka (misal user mengetik teks), biarkan apa adanya
                    return new Intl.NumberFormat('id-ID', { 
                        style: 'currency', 
                        currency: 'IDR', 
                        minimumFractionDigits: 0 
                    }).format(angka);
                },
								
                getStatusColor(status) {
                    const colors = {
                        'menunggu': 'bg-gray-200 text-gray-700',
                        'DRAFT': 'bg-orange-100 text-orange-700',
                        'Verifying': 'bg-blue-100 text-blue-700',
                        'Sudah Bayar': 'bg-green-100 text-green-700',
                        'READY': 'bg-yellow-400 text-black',
                        'SENT': 'bg-purple-100 text-purple-700'
                    };
                    return colors[status] || 'bg-red-100 text-red-700';
                }
            }
        }
    </script>
</body>
</html>
